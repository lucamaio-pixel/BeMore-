<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BeMore — Invito 24 Maggio</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Manrope:wght@300;400;500;600;700&family=Italiana&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet" />

<script src="image-slot.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
  html, body { margin:0; padding:0; height:100%; background:#E9E4D8; font-family: 'Manrope', system-ui, sans-serif; }
  *, *::before, *::after { box-sizing: border-box; }

  /* ─── Card base ─── */
  .card {
    width: 540px;
    height: 960px;
    position: relative;
    overflow: hidden;
    color: #1F2A24;
    font-family: 'Manrope', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .card .serif  { font-family: 'Cormorant Garamond', serif; font-weight: 400; letter-spacing: -0.01em; }
  .card .display{ font-family: 'Italiana', serif; font-weight: 400; }
  .card .mono   { font-family: 'DM Mono', ui-monospace, monospace; }
  .eyebrow      { font-size: 10px; letter-spacing: 0.32em; text-transform: uppercase; font-weight: 500; }
  .rule { height: 0.5px; background: currentColor; opacity: .4; }

  /* ─────────────────────────────────────────────────────────────
     V1 — EDITORIAL CREAM
     Refined magazine-style invitation
     ───────────────────────────────────────────────────────────── */
  .v1 { background:#F1ECE2; color:#1F2A24; padding: 40px 36px; display:flex; flex-direction:column; }
  .v1 .topbar { display:flex; justify-content:space-between; align-items:center; }
  .v1 .brand-wordmark { font-family:'Italiana', serif; font-size: 28px; letter-spacing:.18em; }
  .v1 .num { font-family:'DM Mono', monospace; font-size: 10px; letter-spacing: .2em; color:#5C6B62; }
  .v1 .hero { margin-top: 28px; }
  .v1 .kicker { font-size: 10px; letter-spacing: .32em; text-transform: uppercase; color:#5C6B62; }
  .v1 .title { font-family:'Cormorant Garamond', serif; font-weight: 400; font-size: 64px; line-height: .95; letter-spacing: -0.015em; margin: 14px 0 0; }
  .v1 .title em { font-style: italic; font-weight: 300; color:#3F5A4D; }
  .v1 .date-block { display:flex; align-items:flex-end; gap:20px; margin-top: 56px; }
  .v1 .date-num { font-family:'Italiana', serif; font-size: 80px; line-height: 1; }
  .v1 .date-info { padding-bottom: 6px; font-size: 12px; line-height: 1.55; color:#3F4A44; max-width: 200px; }
  .v1 .date-info strong { font-weight: 600; color:#1F2A24; display:block; font-size:13px; letter-spacing:.04em; text-transform:uppercase; }
  .v1 .program { margin-top: 28px; flex: 1; }
  .v1 .program-head { display:flex; justify-content:space-between; align-items:baseline; padding-bottom: 10px; border-bottom: 0.5px solid rgba(31,42,36,.25); }
  .v1 .program-row { display:grid; grid-template-columns: 56px 12px 1fr; gap:14px; padding: 11px 0; border-bottom: 0.5px solid rgba(31,42,36,.12); align-items:start; }
  .v1 .program-row:last-child{ border-bottom:none; }
  .v1 .pr-time { font-family:'DM Mono', monospace; font-size: 12px; padding-top:3px; color:#3F4A44; }
  .v1 .pr-dot  { width: 7px; height: 7px; border-radius:50%; margin-top: 7px; }
  .v1 .pr-name { font-size: 14px; font-weight: 500; color:#1F2A24; letter-spacing:.01em; }
  .v1 .pr-desc { font-size: 11.5px; color:#5C6B62; margin-top: 2px; line-height: 1.5; }
  .v1 .footer { margin-top: 24px; display:grid; grid-template-columns: 1fr auto; gap:18px; align-items:end; }
  .v1 .price-stack { display:flex; flex-direction:column; gap:2px; }
  .v1 .price-stack .lbl { font-size: 9.5px; letter-spacing: .3em; text-transform: uppercase; color:#5C6B62; }
  .v1 .price-stack .val { font-family:'Cormorant Garamond', serif; font-size: 36px; line-height:1; }
  .v1 .price-stack .sub { font-size: 11px; color:#3F4A44; margin-top:4px; }
  .v1 .cta-pill { background:#1F2A24; color:#F1ECE2; padding: 14px 18px; border-radius: 999px; display:inline-flex; align-items:center; gap:10px; font-size: 12px; letter-spacing:.06em; }
  .v1 .cta-pill .arr { font-family:'DM Mono', monospace; }

  /* ─────────────────────────────────────────────────────────────
     V2 — DARK MODERN
     Sophisticated, contemporary, "premium gym" feel
     ───────────────────────────────────────────────────────────── */
  .v2 {
    --bg:#16201B; --text:#F4ECD8; --text-2:#9AAEA0; --accent:#9FE1CB; --accent-ink:#16201B;
    --line: color-mix(in srgb, var(--text) 18%, transparent);
    --line-soft: color-mix(in srgb, var(--text) 11%, transparent);
    background:var(--bg); color:var(--text); padding: 0; display:flex; flex-direction:column;
  }
  .v2.theme-notte       { --bg:#0F1A2A; --text:#ECE3D4; --text-2:#8FA4BC; --accent:#B5D4F4; --accent-ink:#0F1A2A; }
  .v2.theme-terracotta  { --bg:#2A1B14; --text:#F2E2D0; --text-2:#C9A892; --accent:#E89A6E; --accent-ink:#2A1B14; }
  .v2.theme-vino        { --bg:#1F1218; --text:#F2DCDC; --text-2:#BFA0A4; --accent:#E8B5B0; --accent-ink:#1F1218; }
  .v2.theme-carbone     { --bg:#161616; --text:#ECE3D4; --text-2:#A09889; --accent:#D4A263; --accent-ink:#161616; }
  .v2.theme-oliva       { --bg:#1C1F12; --text:#F2EBD0; --text-2:#A8A88A; --accent:#C9D86A; --accent-ink:#1C1F12; }

  .v2 .v2-top { padding: 38px 34px 0; display:flex; justify-content:space-between; align-items:center; }
  .v2 .v2-mark { font-family:'Italiana', serif; font-size: 30px; letter-spacing:.16em; }
  .v2 .v2-tag  { font-size: 10px; letter-spacing:.3em; text-transform:uppercase; color:var(--text-2); }
  .v2 .v2-hero { padding: 30px 34px 0; }
  .v2 .v2-eye  { font-size: 10px; letter-spacing:.32em; text-transform:uppercase; color:var(--text-2); }
  .v2 .v2-title{ font-family:'Cormorant Garamond', serif; font-weight: 300; font-size: 76px; line-height: .92; letter-spacing:-0.02em; margin: 14px 0 0; color:var(--text); }
  .v2 .v2-title em { font-style: italic; color:var(--accent); font-weight: 300; }
  .v2 .v2-meta { padding: 22px 34px 0; display:grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .v2 .v2-meta .cell { padding: 14px 0; border-top:0.5px solid var(--line); }
  .v2 .v2-meta .lbl  { font-size: 9px; letter-spacing:.3em; text-transform:uppercase; color:var(--text-2); margin-bottom: 6px; font-weight:500; }
  .v2 .v2-meta .val  { font-family:'Cormorant Garamond', serif; font-size: 19px; line-height: 1.15; color:var(--text); }
  .v2 .v2-meta .val small { display:block; font-family:'Manrope', sans-serif; font-size:10.5px; color:var(--text-2); margin-top: 3px; letter-spacing:.04em; }
  .v2 .v2-prog { padding: 22px 34px 0; flex:1; }
  .v2 .v2-prog-head { font-size: 10px; letter-spacing:.32em; text-transform:uppercase; color:var(--text-2); margin-bottom: 12px; display:flex; justify-content:space-between; }
  .v2 .v2-row { display:grid; grid-template-columns: 48px 1fr auto; gap: 14px; align-items:center; padding: 11px 0; border-top: 0.5px solid var(--line-soft); }
  .v2 .v2-row:last-child { border-bottom: 0.5px solid var(--line-soft); }
  .v2 .v2-time { font-family:'DM Mono', monospace; font-size: 11.5px; color:var(--text-2); }
  .v2 .v2-name { font-size: 13.5px; color:var(--text); font-weight: 500; }
  .v2 .v2-name span { display:block; font-size: 11px; color:var(--text-2); margin-top: 2px; font-weight: 400; }
  .v2 .v2-pill { font-size: 9.5px; letter-spacing:.18em; text-transform:uppercase; padding: 4px 9px; border:0.5px solid var(--line); border-radius: 999px; color:var(--text-2); }
  .v2 .v2-pill.accent { color:var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
  .v2 .v2-foot { padding: 18px 34px 30px; display:flex; justify-content:space-between; align-items:center; gap: 16px; }
  .v2 .v2-price { display:flex; flex-direction:column; }
  .v2 .v2-price .p { font-family:'Cormorant Garamond', serif; font-size: 38px; line-height:1; color:var(--text); }
  .v2 .v2-price .s { font-size: 10.5px; color:var(--text-2); margin-top:3px; letter-spacing:.04em; }
  .v2 .v2-cta { background:var(--accent); color:var(--accent-ink); padding: 14px 20px; border-radius: 999px; font-size: 12px; font-weight: 600; letter-spacing:.06em; text-transform: uppercase; display:inline-flex; align-items:center; gap:10px; }

  /* Photo hero variants */
  .v2.with-photo .v2-top { display:none; }
  .v2 .v2-photo { position:relative; width:100%; height:340px; overflow:hidden; background: color-mix(in srgb, var(--bg) 70%, #000); }
  .v2 .v2-photo image-slot { width:100%; height:100%; display:block; --is-bg:#2a2a28; --is-fg:var(--text-2); --is-border: color-mix(in srgb, var(--text) 25%, transparent); }
  .v2 .v2-photo::after { content:''; position:absolute; inset:0; pointer-events:none; background: linear-gradient(180deg, rgba(0,0,0,.35) 0%, transparent 30%, transparent 60%, color-mix(in srgb, var(--bg) 90%, transparent) 100%); }
  .v2 .v2-photo-overlay { position:absolute; inset:0; padding: 28px 30px; display:flex; flex-direction:column; justify-content:space-between; pointer-events:none; z-index:2; }
  .v2 .v2-photo-overlay .ovr-top { display:flex; justify-content:space-between; align-items:center; color:var(--text); }
  .v2 .v2-photo-overlay .ovr-mark { font-family:'Italiana', serif; font-size: 26px; letter-spacing:.16em; }
  .v2 .v2-photo-overlay .ovr-tag { font-size: 9.5px; letter-spacing:.3em; text-transform:uppercase; color:var(--text); opacity:.85; }
  .v2 .v2-photo-overlay .ovr-bot { font-size: 10px; letter-spacing:.32em; text-transform:uppercase; color:var(--text); opacity:.85; }
  .v2.with-photo .v2-hero { padding-top: 22px; }
  .v2.with-photo .v2-eye { display:none; }
  .v2.with-photo .v2-title { font-size: 44px; line-height: .96; }

  /* ─────────────────────────────────────────────────────────────
     V3 — POSTER NATURAL
     Bold poster style, single column, organic feel
     ───────────────────────────────────────────────────────────── */
  .v3 { background:#EDE6D6; color:#2A352D; padding: 40px 38px; display:flex; flex-direction:column; }
  .v3 .v3-top { display:flex; justify-content:space-between; align-items:flex-start; }
  .v3 .v3-mark { font-family:'Italiana', serif; font-size: 24px; letter-spacing:.2em; }
  .v3 .v3-stamp { text-align:right; }
  .v3 .v3-stamp .ed { font-size: 9.5px; letter-spacing:.3em; text-transform:uppercase; color:#5F6F62; }
  .v3 .v3-stamp .no { font-family:'DM Mono', monospace; font-size: 10.5px; color:#2A352D; margin-top: 2px; }
  .v3 .v3-hero { margin-top: 22px; position:relative; }
  .v3 .v3-bigdate { display:flex; align-items:flex-end; gap: 10px; }
  .v3 .v3-bigdate .d { font-family:'Italiana', serif; font-size: 220px; line-height: .8; letter-spacing: -0.03em; color:#2A352D; }
  .v3 .v3-bigdate .ms { display:flex; flex-direction:column; padding-bottom: 16px; }
  .v3 .v3-bigdate .ms span:first-child { font-family:'Cormorant Garamond', serif; font-style: italic; font-size: 36px; line-height: 1; color:#3F5A4D; }
  .v3 .v3-bigdate .ms span:last-child { font-size: 10.5px; letter-spacing:.3em; text-transform:uppercase; margin-top: 6px; color:#5F6F62; }
  .v3 .v3-headline { font-family:'Cormorant Garamond', serif; font-size: 32px; line-height: 1.05; margin-top: 12px; font-weight: 400; max-width: 92%; }
  .v3 .v3-headline em { font-style: italic; color:#3F5A4D; }
  .v3 .v3-body { margin-top: 22px; flex: 1; display:flex; flex-direction: column; gap: 18px; }
  .v3 .v3-info { display:grid; grid-template-columns: auto 1fr; gap: 10px 16px; align-items:baseline; }
  .v3 .v3-info .k { font-size: 9.5px; letter-spacing:.3em; text-transform:uppercase; color:#5F6F62; padding-top: 4px; }
  .v3 .v3-info .v { font-size: 13px; color:#2A352D; line-height: 1.45; }
  .v3 .v3-info .v b { font-weight: 600; }
  .v3 .v3-prog { background:#2A352D; color:#EDE6D6; border-radius: 14px; padding: 18px 20px; }
  .v3 .v3-prog-head { font-size: 9.5px; letter-spacing:.3em; text-transform:uppercase; color:#9AAEA0; margin-bottom: 8px; }
  .v3 .v3-prog-row { display:grid; grid-template-columns: 44px 1fr; gap: 10px; padding: 7px 0; border-top: 0.5px solid rgba(237,230,214,.15); align-items:baseline; }
  .v3 .v3-prog-row:first-of-type { border-top: none; }
  .v3 .v3-prog-row .t { font-family:'DM Mono', monospace; font-size: 11px; color:#9FE1CB; }
  .v3 .v3-prog-row .n { font-size: 13px; color:#EDE6D6; font-weight: 500; }
  .v3 .v3-foot { display:flex; justify-content:space-between; align-items:center; padding-top: 14px; border-top: 0.5px solid rgba(42,53,45,.22); }
  .v3 .v3-foot .l { font-size: 11px; color:#5F6F62; line-height: 1.4; max-width: 60%; }
  .v3 .v3-foot .l b { color:#2A352D; }
  .v3 .v3-foot .r { font-family:'Cormorant Garamond', serif; font-size: 28px; }
  .v3 .v3-foot .r small { font-size: 11px; font-family:'Manrope', sans-serif; letter-spacing:.04em; color:#5F6F62; display:block; }

  /* V3 photo variant */
  .v3.with-photo { padding: 32px 32px 36px; }
  .v3.with-photo .v3-bigdate .d { font-size: 170px; }
  .v3.with-photo .v3-bigdate .ms span:first-child { font-size: 30px; }
  .v3.with-photo .v3-headline { font-size: 24px; margin-top: 8px; }
  .v3 .v3-photo { position:relative; width: calc(100% + 64px); margin: 18px -32px 0; height: 220px; overflow:hidden; background:#1F2A24; }
  .v3 .v3-photo image-slot { width:100%; height:100%; display:block; --is-bg:#2a2a28; --is-fg:#bdb59f; --is-border:rgba(255,255,255,.18); }
  .v3.with-photo .v3-body { gap: 14px; margin-top: 18px; }
  .v3.with-photo .v3-prog { padding: 14px 18px; }
  .v3.with-photo .v3-prog-row { padding: 5px 0; }

  /* Annotation styles for canvas */
  .note { font-family:'DM Mono', monospace; font-size: 11px; color:#5C6B62; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" data-presets="react">
const PROGRAM = [
  { time: "10:00", name: "Accoglienza & Welcome Drink", desc: "Arrivo in terrazza, OxiGlow Spritz, connessione con il gruppo", dot: "#9FE1CB", tag: "wellness", tagClass: "mint" },
  { time: "10:20", name: "Camminata Zen con Mimma",     desc: "Movimento consapevole · respiro e presenza",                   dot: "#9FE1CB", tag: "movimento", tagClass: "mint" },
  { time: "11:00", name: "Pratica Yoga con Mimma",      desc: "Sessione guidata · energia, equilibrio, corpo",                dot: "#9FE1CB", tag: "yoga",      tagClass: "mint" },
  { time: "11:50", name: "Wellness Bar con Mileidy",    desc: "Due cocktail wellness · momento di condivisione",              dot: "#D4A95A", tag: "drink",     tagClass: "gold" },
  { time: "12:20", name: "Chiusura & Intenzione",       desc: "Welcome kit · invito al prossimo evento",                       dot: "#B5D4F4", tag: "rituale",   tagClass: "sky"  },
];

function CardEditorial() {
  return (
    <div className="card v1">
      <div className="topbar">
        <div className="brand-wordmark">BeMore</div>
        <div className="num">N°01 · MAY 26</div>
      </div>
      <div className="hero">
        <div className="kicker">Wellness Sunday · Messina</div>
        <h1 className="title">Una mattina<br/>per <em>respirare</em>,<br/>muoversi, brindare.</h1>
      </div>
      <div className="date-block">
        <div className="date-num">24</div>
        <div className="date-info">
          <strong>Domenica · Maggio</strong>
          10:00 — 12:30<br/>
          Terrazza Panoramica BonHome<br/>
          Sant'Agata, Messina
        </div>
      </div>
      <div className="program">
        <div className="program-head">
          <span className="eyebrow">Cronoprogramma</span>
          <span className="mono" style={{fontSize:10, color:'#5C6B62'}}>5 momenti · 2h30</span>
        </div>
        {PROGRAM.map((s,i) => (
          <div className="program-row" key={i}>
            <div className="pr-time">{s.time}</div>
            <div className="pr-dot" style={{background:s.dot}}></div>
            <div>
              <div className="pr-name">{s.name}</div>
              <div className="pr-desc">{s.desc}</div>
            </div>
          </div>
        ))}
      </div>
      <div className="footer">
        <div className="price-stack">
          <span className="lbl">Contributo</span>
          <span className="val">25€ <span style={{fontSize:14, color:'#5C6B62'}}>· welcome kit incluso</span></span>
          <span className="sub">15 posti · prenotazione su WhatsApp</span>
        </div>
        <div className="cta-pill">Prenota <span className="arr">→</span></div>
      </div>
    </div>
  );
}

function CardDark({ theme = "foresta", withPhoto = false, slotId = "" }) {
  return (
    <div className={`card v2 theme-${theme} ${withPhoto ? 'with-photo' : ''}`}>
      <div className="v2-top">
        <div className="v2-mark">BeMore</div>
        <div className="v2-tag">Wellness Experience</div>
      </div>
      {withPhoto && (
        <div className="v2-photo">
          <image-slot id={slotId} placeholder="Trascina qui la foto della terrazza · 540×340" shape="rect"></image-slot>
          <div className="v2-photo-overlay">
            <div className="ovr-top">
              <div className="ovr-mark">BeMore</div>
              <div className="ovr-tag">Wellness Experience</div>
            </div>
            <div className="ovr-bot">Vol. 01 · Wellness Sunday · Messina</div>
          </div>
        </div>
      )}
      <div className="v2-hero">
        <div className="v2-eye">Vol. 01 · Wellness Sunday</div>
        <div className="v2-title">Respira.<br/><em>Muoviti.</em><br/>Connettiti.</div>
      </div>
      <div className="v2-meta">
        <div className="cell"><div className="lbl">Quando</div><div className="val">24 Maggio<small>Domenica · 10:00–12:30</small></div></div>
        <div className="cell"><div className="lbl">Dove</div><div className="val">BonHome<small>Terrazza · Sant'Agata, ME</small></div></div>
        <div className="cell"><div className="lbl">Posti</div><div className="val">15 max<small>su prenotazione</small></div></div>
      </div>
      <div className="v2-prog">
        <div className="v2-prog-head"><span>Programma</span><span>2h 30min</span></div>
        {PROGRAM.map((s, i) => (
          <div className="v2-row" key={i}>
            <div className="v2-time">{s.time}</div>
            <div className="v2-name">{s.name}<span>{s.desc}</span></div>
            <div className={`v2-pill ${i === 3 ? 'accent' : ''}`}>{s.tag}</div>
          </div>
        ))}
      </div>
      <div className="v2-foot">
        <div className="v2-price">
          <div className="p">25€</div>
          <div className="s">welcome kit incluso · OxiGlow Spritz, MAMI Morning</div>
        </div>
        <div className="v2-cta">Prenota →</div>
      </div>
    </div>
  );
}

function CardPoster({ withPhoto = false, slotId = "" }) {
  return (
    <div className={`card v3 ${withPhoto ? 'with-photo' : ''}`}>
      <div className="v3-top">
        <div className="v3-mark">BeMore</div>
        <div className="v3-stamp">
          <div className="ed">Edizione 01</div>
          <div className="no">N° 24 / 05 / 26</div>
        </div>
      </div>
      <div className="v3-hero">
        <div className="v3-bigdate">
          <div className="d">24</div>
          <div className="ms">
            <span>maggio</span>
            <span>Domenica · 10—12:30</span>
          </div>
        </div>
        <div className="v3-headline">Una mattina di <em>movimento, respiro e cura</em> sulla terrazza panoramica BonHome.</div>
        {withPhoto && (
          <div className="v3-photo">
            <img src="assets/terrazza.png" alt="Terrazza Panoramica BonHome" style={{width:'100%',height:'100%',objectFit:'cover',display:'block'}} />
          </div>
        )}
      </div>
      <div className="v3-body">
        <div className="v3-info">
          <div className="k">Luogo</div>
